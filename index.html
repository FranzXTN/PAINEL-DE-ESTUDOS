
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Estudos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Menu -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Painel de Estudos</a>
        </div>
    </nav>

    <!-- Apresentação -->
    <main class="container my-4">
        <h1>Bem-vindo ao seu painel!</h1>
        <p>Acompanhe seu progresso nos estudos.</p>

        <!-- Cards -->
        <div class="row g-3">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Curso</h5>
                        <p class="card-text">Desenvolvimento Web</p>
                        <span class="badge text-bg-primary">Em andamento</span>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Tarefas</h5>
                        <p class="card-text">3 tarefas concluídas</p>
                        <span class="badge text-bg-success">Progresso</span>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Horas de estudo</h5>
                        <p class="card-text">4 horas estudadas</p>
                        <span class="badge text-bg-warning">Continue!</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Aviso -->
        <div class="alert alert-info mt-4" role="alert">
            Continue estudando para atingir suas metas!
        </div>

        <button type="button" class="btn btn-primary">
            Ver meu progresso
        </button>
    </main>

    <!-- Rodapé -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p class="mb-0">Painel de Estudos - 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
